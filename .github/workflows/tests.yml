name: Tests
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
        rdmo: ['2.5.2', '3.0-dev']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev,local]'
      - if: matrix.rdmo == '2.5.2'
        run: pip install 'rdmo==2.5.2'
      - if: matrix.rdmo == '3.0-dev'
        run: pip install 'rdmo @ git+https://github.com/rdmorganiser/rdmo.git@63486e461f296ac991dbd537b27383c4b97eb1e4'
      - run: ruff check rdmo_gnd tests
      - run: ruff format --check rdmo_gnd tests
      - run: pytest
      - run: python -m build && twine check dist/*

  online-only:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]' 'rdmo==2.5.2'
      - run: >-
          pytest --ignore=tests/test_marc.py --ignore=tests/test_local_index.py
          --ignore=tests/test_local_provider.py --ignore=tests/test_index_update.py
          --ignore=tests/test_index_cli.py
      - run: python -m rdmo_gnd.index.cli --help

  installed-wheel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install build twine
      - run: python -m build && twine check dist/*
      - run: python tests/wheel_smoke.py dist
